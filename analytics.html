<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>燃點 · 數據看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f4f5;--card:#fff;--ink:#111;--mute:#888;--accent:#d95e1e;--line:#e8e8e8;--green:#2d9c5f;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);min-height:100vh}
/* Login */
#login{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px;padding:24px}
#login .logo{font-size:28px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
#login .logo span{color:var(--accent)}
#login form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
#login input{border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:15px;outline:none;background:#fff;transition:border-color .2s}
#login input:focus{border-color:var(--accent)}
#login button{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:background .2s}
#login button:hover{background:var(--accent)}
#login .err{color:#c0392b;font-size:13px;text-align:center}
/* Dashboard */
#dashboard{display:none;padding:0 0 80px}
.dash-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.dash-logo{font-size:18px;font-weight:900;letter-spacing:-.01em}
.dash-logo span{color:var(--accent)}
.dash-actions{display:flex;align-items:center;gap:10px}
.dash-refresh{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--mute);transition:all .2s}
.dash-refresh:hover{border-color:var(--ink);color:var(--ink)}
.dash-signout{border:0;background:transparent;color:var(--mute);font-size:12px;cursor:pointer;padding:8px}
.dash-main{max-width:1120px;margin:0 auto;padding:32px 32px 0}
/* Stats row */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:6px}
.stat-card .label{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:500}
.stat-card .value{font-size:clamp(28px,4vw,44px);font-weight:900;letter-spacing:-.03em;line-height:1}
.stat-card .sub{font-size:12px;color:var(--mute)}
.stat-card.accent .value{color:var(--accent)}
.stat-card.green .value{color:var(--green)}
/* Grid */
.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
.dash-full{grid-column:1/-1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 12px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:13.5px;font-weight:700;letter-spacing:.02em}
.panel-head em{font-style:normal;font-size:12px;color:var(--mute)}
/* Chart */
.chart-wrap{padding:16px 24px 20px;position:relative;height:180px}
canvas{display:block}
/* Bars */
.bar-list{padding:16px 0 8px}
.bar-item{display:flex;align-items:center;gap:12px;padding:7px 24px;cursor:default;transition:background .15s}
.bar-item:hover{background:#fafafa}
.bar-item .rank{width:18px;text-align:right;font-size:11px;color:var(--mute);flex:none}
.bar-item .name{flex:1;min-width:0;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-item .bar-track{flex:none;width:110px;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar-item .bar-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-item .bar-fill.green{background:var(--green)}
.bar-item .count{flex:none;width:32px;text-align:right;font-size:12.5px;font-weight:700;color:var(--ink)}
/* Recent */
.recent-list{padding:8px 0 4px}
.recent-item{display:flex;align-items:center;gap:12px;padding:9px 24px;border-bottom:1px solid #f5f5f5}
.recent-item:last-child{border:0}
.event-dot{width:8px;height:8px;border-radius:50%;flex:none}
.event-dot.case_view{background:var(--accent)}
.event-dot.video_play{background:var(--green)}
.event-dot.page_view{background:#aaa}
.recent-item .ev-type{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);flex:none;width:72px}
.recent-item .ev-title{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-item .ev-country{font-size:12px;color:var(--mute);flex:none}
.recent-item .ev-time{font-size:11.5px;color:var(--mute);flex:none;width:80px;text-align:right}
/* Empty state */
.empty{padding:40px 24px;text-align:center;color:var(--mute);font-size:14px}
/* Loading */
.loading{display:flex;align-items:center;justify-content:center;height:120px;color:var(--mute);font-size:14px;gap:10px}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){
  .stats{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .dash-main{padding:16px 16px 0}
  .dash-header{padding:16px}
  .bar-item .bar-track{width:70px}
}
</style>
</head>
<body>

<!-- Login Screen -->
<div id="login">
  <div class="logo">燃<span>點</span> · 數據看板</div>
  <form id="loginForm">
    <input type="password" id="secretInput" placeholder="輸入訪問密碼" autocomplete="current-password" />
    <button type="submit">進入看板</button>
    <div class="err" id="loginErr" style="display:none">密碼錯誤，請重試</div>
  </form>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <header class="dash-header">
    <div class="dash-logo">燃<span>點</span> · 數據看板</div>
    <div class="dash-actions">
      <button class="dash-refresh" onclick="loadData()">↻ 刷新數據</button>
      <button class="dash-signout" onclick="signOut()">退出</button>
    </div>
  </header>

  <main class="dash-main">
    <!-- Stats Row -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">今日訪客</div>
        <div class="value" id="statToday">—</div>
        <div class="sub">Page views today</div>
      </div>
      <div class="stat-card accent">
        <div class="label">本週訪客</div>
        <div class="value" id="statWeek">—</div>
        <div class="sub">Page views this week</div>
      </div>
      <div class="stat-card">
        <div class="label">案例查看</div>
        <div class="value" id="statCases">—</div>
        <div class="sub">Case opens (14 days)</div>
      </div>
      <div class="stat-card green">
        <div class="label">視頻播放</div>
        <div class="value" id="statVideos">—</div>
        <div class="sub">Video plays (14 days)</div>
      </div>
    </div>

    <!-- Charts + Top Cases -->
    <div class="dash-grid">
      <!-- Daily trend -->
      <div class="panel">
        <div class="panel-head">
          <h3>近 14 天訪問趨勢</h3>
          <em id="trendRange">—</em>
        </div>
        <div class="chart-wrap">
          <canvas id="trendChart"></canvas>
        </div>
      </div>

      <!-- Top Cases -->
      <div class="panel">
        <div class="panel-head">
          <h3>熱門作品案例</h3>
          <em id="casesTotal">—</em>
        </div>
        <div class="bar-list" id="topCasesList">
          <div class="loading"><div class="spinner"></div>加載中…</div>
        </div>
      </div>

      <!-- Top Videos (full width) -->
      <div class="panel dash-full">
        <div class="panel-head">
          <h3>熱門視頻播放</h3>
          <em id="videosTotal">—</em>
        </div>
        <div class="bar-list" id="topVideosList">
          <div class="loading"><div class="spinner"></div>加載中…</div>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="panel dash-full">
        <div class="panel-head">
          <h3>最近活動</h3>
          <em>Last 30 events</em>
        </div>
        <div class="recent-list" id="recentList">
          <div class="loading"><div class="spinner"></div>加載中…</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
let SECRET = "";

// ── Login ──────────────────────────────────────────────────────────────────
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const s = document.getElementById("secretInput").value.trim();
  if (!s) return;
  SECRET = s;
  const ok = await checkSecret(s);
  if (ok) {
    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
    sessionStorage.setItem("ibd_analytics_secret", s);
    loadData();
  } else {
    SECRET = "";
    document.getElementById("loginErr").style.display = "block";
  }
});

async function checkSecret(s) {
  try {
    const r = await fetch(`/api/analytics?secret=${encodeURIComponent(s)}`);
    return r.ok;
  } catch { return false; }
}

function signOut() {
  sessionStorage.removeItem("ibd_analytics_secret");
  SECRET = "";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("login").style.display = "flex";
}

// Auto-login if cached
const cached = sessionStorage.getItem("ibd_analytics_secret");
if (cached) {
  SECRET = cached;
  checkSecret(cached).then(ok => {
    if (ok) {
      document.getElementById("login").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      loadData();
    } else {
      sessionStorage.removeItem("ibd_analytics_secret");
    }
  });
}

// ── Load Data ─────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const r = await fetch(`/api/analytics?secret=${encodeURIComponent(SECRET)}`);
    if (!r.ok) { signOut(); return; }
    const data = await r.json();
    renderDashboard(data);
  } catch (e) {
    console.error(e);
  }
}

function renderDashboard(d) {
  // Stats
  document.getElementById("statToday").textContent = fmt(d.todayVisits);
  document.getElementById("statWeek").textContent = fmt(d.weekVisits);
  document.getElementById("statCases").textContent = fmt(d.totalCaseViews);
  document.getElementById("statVideos").textContent = fmt(d.totalVideoPlays);

  // Trend chart
  renderTrendChart(d.days || []);

  // Top cases
  const casesEl = document.getElementById("topCasesList");
  const topC = (d.topCases || []).slice(0, 8);
  const maxC = topC[0]?.views || 1;
  document.getElementById("casesTotal").textContent = topC.length + " 個作品";
  if (!topC.length) { casesEl.innerHTML = '<div class="empty">暫無數據</div>'; }
  else casesEl.innerHTML = topC.map((c, i) => `
    <div class="bar-item">
      <span class="rank">${i + 1}</span>
      <span class="name">${esc(c.title || c.id)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${Math.round((c.views / maxC) * 100)}%"></span></span>
      <span class="count">${c.views}</span>
    </div>`).join("");

  // Top videos
  const videosEl = document.getElementById("topVideosList");
  const topV = (d.topVideos || []).slice(0, 6);
  const maxV = topV[0]?.plays || 1;
  document.getElementById("videosTotal").textContent = topV.length + " 條視頻";
  if (!topV.length) { videosEl.innerHTML = '<div class="empty">暫無數據</div>'; }
  else videosEl.innerHTML = topV.map((v, i) => `
    <div class="bar-item">
      <span class="rank">${i + 1}</span>
      <span class="name">${esc(v.title || v.id)}</span>
      <span class="bar-track"><span class="bar-fill green" style="width:${Math.round((v.plays / maxV) * 100)}%"></span></span>
      <span class="count">${v.plays}</span>
    </div>`).join("");

  // Recent
  const recentEl = document.getElementById("recentList");
  const recent = (d.recent || []).slice(0, 30);
  if (!recent.length) { recentEl.innerHTML = '<div class="empty">暫無活動記錄</div>'; }
  else recentEl.innerHTML = recent.map(e => `
    <div class="recent-item">
      <span class="event-dot ${e.event}"></span>
      <span class="ev-type">${eventLabel(e.event)}</span>
      <span class="ev-title">${esc(e.title || e.id || "—")}</span>
      <span class="ev-country">${esc(e.country || "")}</span>
      <span class="ev-time">${relTime(e.ts)}</span>
    </div>`).join("");
}

function renderTrendChart(days) {
  const canvas = document.getElementById("trendChart");
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.parentElement.clientWidth - 48;
  const H = 148;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  if (!days.length) return;
  const labels = days.map(d => d.date.slice(5));
  const vals = days.map(d => d.visits || 0);
  const maxV = Math.max(...vals, 1);
  const n = labels.length;
  const pad = 8; const padT = 12; const padB = 24;
  const slotW = (W - pad * 2) / Math.max(n - 1, 1);
  document.getElementById("trendRange").textContent = labels[0] + " — " + labels[labels.length - 1];

  // Grid lines
  ctx.strokeStyle = "#f0f0f0"; ctx.lineWidth = 1;
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const y = padT + (H - padT - padB) * (1 - f);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  });

  // Line
  const pts = vals.map((v, i) => ({ x: pad + i * slotW, y: padT + (H - padT - padB) * (1 - v / maxV) }));
  const grad = ctx.createLinearGradient(0, padT, 0, H - padB);
  grad.addColorStop(0, "rgba(217,94,30,.22)"); grad.addColorStop(1, "rgba(217,94,30,0)");
  ctx.beginPath();
  ctx.moveTo(pts[0].x, H - padB);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length - 1].x, H - padB);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = "#d95e1e"; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.stroke();

  // Dots & labels
  ctx.fillStyle = "#d95e1e";
  pts.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2); ctx.fill();
    if (i % Math.ceil(n / 7) === 0 || i === n - 1) {
      ctx.fillStyle = "#aaa"; ctx.font = `11px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = "center"; ctx.fillText(labels[i], p.x, H - 4);
      ctx.fillStyle = "#d95e1e";
    }
  });
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(n) { return n == null ? "0" : Number(n).toLocaleString(); }
function esc(s) { return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function eventLabel(e) { return { case_view: "案例", video_play: "視頻", page_view: "訪問" }[e] || e; }
function relTime(ts) {
  if (!ts) return "—";
  const d = Math.floor((Date.now() - ts) / 1000);
  if (d < 60) return "剛剛";
  if (d < 3600) return Math.floor(d / 60) + " 分前";
  if (d < 86400) return Math.floor(d / 3600) + " 小時前";
  return Math.floor(d / 86400) + " 天前";
}

// Resize chart on window resize
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (SECRET) loadData(); }, 400); });
</script>
</body>
</html>
